spring:
  application:
    name: acctsearch-service
  profiles:
    default: local
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 10
        retry.backoff.ms: 1000

server:
  port: 8100

management:
  endpoints:
    web:
      exposure:
        include: health,info

acctsearch:
  max-results: 20
  default-username: learner-user
  data-loader:
    enabled: true
  kafka:
    account-search-events-topic: account-search-events
    account-search-events-dlt-topic: account-search-events-dlt

logging:
  level:
    root: INFO
    com.example.acctsearch: INFO
